name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # create GitHub Releases + upload assets

jobs:
  build-release:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      asset: ${{ steps.meta.outputs.asset }}
      sha256: ${{ steps.sha.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.6"

      - name: Compute version
        id: meta
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use v<major>.<minor>.<patch>; got: $TAG_NAME" >&2
            exit 1
          fi

          VERSION="${TAG_NAME#v}"
          ASSET="local-data_${VERSION}_darwin_arm64.tar.gz"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Build binary (darwin/arm64)
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          GOOS=darwin GOARCH=arm64 go build \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o local-data ./cmd/local-data

          ./local-data version

      - name: Package tarball
        shell: bash
        env:
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          tar -czf "$ASSET" local-data
          ls -lh "$ASSET"

      - name: Compute sha256
        id: sha
        shell: bash
        env:
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          SHA="$(shasum -a 256 "$ASSET" | awk '{print $1}')"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA256=$SHA"

      - name: Create GitHub Release + upload asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: v${{ steps.meta.outputs.version }}
          files: ${{ steps.meta.outputs.asset }}
          generate_release_notes: true

  bump-homebrew-tap:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tap repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: danieljhkim/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Update formula
        shell: bash
        env:
          VERSION: ${{ needs.build-release.outputs.version }}
          SHA: ${{ needs.build-release.outputs.sha256 }}
        run: |
          FORMULA="tap/Formula/local-data.rb"

          ruby - "$FORMULA" <<'RUBY'
          formula = ARGV.fetch(0)
          version = ENV.fetch("VERSION")
          sha = ENV.fetch("SHA")
          url = "https://github.com/danieljhkim/local-data-platform/releases/download/v#{version}/local-data_#{version}_darwin_arm64.tar.gz"
          contents = File.read(formula)

          {
            "url" => url,
            "sha256" => sha,
            "version" => version,
          }.each do |name, value|
            replaced = contents.sub!(/^\s*#{Regexp.escape(name)}\s+\".*?\"/, "  #{name} \"#{value}\"")
            abort("missing #{name} entry in #{formula}") unless replaced
          end

          File.write(formula, contents)
          RUBY

          echo "Updated formula:"
          sed -n '1,120p' "$FORMULA"

      - name: Commit and push tap update
        shell: bash
        env:
          VERSION: ${{ needs.build-release.outputs.version }}
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Formula/local-data.rb
          git commit -m "local-data v$VERSION"
          git push
